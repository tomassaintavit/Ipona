<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a7f37">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Ipona</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Ipona</h1>
    <nav id="nav" class="hidden">
      <button data-view="eventos">Eventos</button>
      <button data-view="tabla">Tabla</button>
      <button data-view="stats">Stats</button>
      <button id="logout">Salir</button>
    </nav>
  </header>

  <main>
    <section id="view-auth" class="view">
      <div class="card">
        <h2>Ingresar</h2>
        <form id="form-login">
          <input name="username" placeholder="Usuario" required>
          <input name="password" type="password" placeholder="Contraseña" required>
          <button type="submit">Entrar</button>
        </form>
        <p>¿No tenés cuenta?</p>
        <form id="form-register">
          <input name="email" type="email" placeholder="Email" required>
          <input name="username" placeholder="Usuario" required minlength="3" pattern="[a-zA-Z0-9_]+">
          <input name="password" type="password" placeholder="Contraseña (mínimo 8)" required minlength="8">
          <button type="submit">Registrarme</button>
        </form>
      </div>
    </section>

    <section id="view-eventos" class="view hidden">
      <h2>Eventos del día</h2>
      <div id="eventos-lista"></div>
    </section>

    <section id="view-tabla" class="view hidden">
      <h2>Tabla de posiciones</h2>
      <table id="tabla-posiciones"></table>
      <p><small>Predicciones del día aún no puntuadas se actualizan al finalizar los partidos.</small></p>
    </section>

    <section id="view-stats" class="view hidden">
      <div class="card"><h2>Mis estadísticas</h2><div id="stats-me"></div></div>
      <div class="card"><h2>La IA (ipona-ia)</h2><div id="stats-llm"></div></div>
    </section>
  </main>

  <div id="toast" class="hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
